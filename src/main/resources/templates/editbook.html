<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit book</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />

</head>

<body>
    <h1>Edit book</h1>
    <form th:object="${book}" th:action="@{/save}" method="post">
        <input type="hidden" th:field="*{id}" />
        <p><label>Title <input type="text" th:field="*{title}" /></label></p>
        <p><label>Author <input type="text" th:field="*{author}" /></label></p>
        <p><label>Year <input type="number" th:field="*{publicationYear}" /></label></p>
        <p><label>ISBN <input type="text" th:field="*{isbn}" /></label></p>
        <p><label>Price <input type="number" step="0.01" th:field="*{price}" /></label></p>
        <button type="submit">Save</button>
    </form>
    <a href="/booklist">Back to list</a>
</body>

</html>
